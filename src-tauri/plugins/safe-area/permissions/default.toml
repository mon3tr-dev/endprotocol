# Default permission set for the safe area plugin.
#
# The per-command `allow-get-safe-area-insets` / `deny-get-safe-area-insets`
# permissions are **autogenerated** by `tauri-plugin`'s build script (see
# build.rs) into `permissions/autogenerated/commands/`. They are referenced
# here, not redefined: a hand-written `[[permission]]` with the same
# identifier shadows the autogenerated one.
#
# This must be a `[default]` section rather than a `[[set]]`: Tauri resolves
# `<plugin>:default` through the manifest's `default_permission` field, and
# a `[[set]]` named "default" is never consulted for that lookup — the
# capability would resolve to an empty permission list and every call would
# fail with "not allowed".
[default]
description = "Default permissions for the safe area plugin."
permissions = ["allow-get-safe-area-insets"]
