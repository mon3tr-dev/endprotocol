# Default permission set for the APK installer plugin.
#
# The per-command `allow-install-apk` / `deny-install-apk` permissions are
# **autogenerated** by `tauri-plugin`'s build script (see build.rs) into
# `permissions/autogenerated/commands/`. They are referenced here, not
# redefined: a hand-written `[[permission]]` with the same identifier shadows
# the autogenerated one.
#
# This must be a `[default]` section rather than a `[[set]]`: Tauri resolves
# `<plugin>:default` through the manifest's `default_permission` field, and
# a `[[set]]` named "default" is never consulted for that lookup — the
# capability would resolve to an empty permission list and every call would
# fail with "not allowed" (which is exactly how `install_apk` behaved on
# Android before this file was corrected).
[default]
description = "Default permissions for the APK installer plugin."
permissions = ["allow-install-apk"]
