[package]
name = "endprotocol"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "endprotocol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
urlencoding = "2"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
aes = "0.8"
cbc = "0.1"
ecb = "0.1"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
digest = "0.10"
des = "0.8"
rsa = "0.9"
flate2 = { version = "1.0", features = ["zlib"] }
base64 = "0.22"
bytes = "1"
http = "1"
uuid = { version = "1.6", features = ["v4"] }
hex = "0.4"
rand = "0.8"
indexmap = { version = "2.0", features = ["serde"] }
tauri-plugin-process = "2.3.1"
walkdir = "2"
rfd = "0.15"
sysinfo = "0.38.4"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Performance"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.dev]
debug = "line-tables-only"
incremental = true
