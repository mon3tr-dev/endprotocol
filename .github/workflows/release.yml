name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-platforms:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            bundles: appimage
          - target: x86_64-apple-darwin
            runner: macos-latest
            bundles: app,dmg
          - target: aarch64-apple-darwin
            runner: macos-latest
            bundles: app,dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            const confPath = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = '${VERSION}';
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Build bundles and updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --ignore-version-mismatches

      - name: Upload platform bundles
        uses: actions/upload-artifact@v4
        with:
          name: platform-bundles-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Build and Release Windows x64
    runs-on: windows-latest
    needs: build-platforms

    steps:
      # ==========================================================
      # Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      # ==========================================================
      # Setup pnpm
      # ==========================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ==========================================================
      # Setup Node.js
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # ==========================================================
      # Install dependencies
      # ==========================================================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ==========================================================
      # Align NPM packages with the Rust crate versions in Cargo.lock
      # (auto-fixes "Found version mismatched Tauri packages")
      # ==========================================================
      - name: Sync Tauri NPM packages with Rust crates
        id: tauri_sync
        shell: bash
        run: |
          set -euo pipefail
          node <<'SYNC_EOF'
          const fs = require('fs');
          const { spawnSync } = require('child_process');

          const TARGET = '--target x86_64-pc-windows-msvc';
          const DRY_RUN = process.env.DRY_RUN === '1';

          function setBuildArgs(extra) {
            const args = [TARGET, extra].filter(Boolean).join(' ');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `args=${args}\n`);
            console.log(`Build args: ${args}`);
          }

          function readJson(p) {
            return JSON.parse(fs.readFileSync(p, 'utf8'));
          }

          // Crate versions as resolved by cargo (workspace root Cargo.lock wins).
          const crateVersions = {};
          for (const lock of ['Cargo.lock', 'src-tauri/Cargo.lock']) {
            if (!fs.existsSync(lock)) continue;
            for (const block of fs.readFileSync(lock, 'utf8').split('[[package]]')) {
              const name = block.match(/^\s*name = "([^"]+)"/m);
              const version = block.match(/^\s*version = "([^"]+)"/m);
              if (name && version && crateVersions[name[1]] === undefined) {
                crateVersions[name[1]] = version[1];
              }
            }
          }

          function npmVersion(name) {
            try {
              return readJson(`node_modules/${name}/package.json`).version;
            } catch {
              return undefined;
            }
          }

          function crateOf(npmName) {
            if (npmName === '@tauri-apps/api') return 'tauri';
            if (npmName.startsWith('@tauri-apps/plugin-')) {
              return `tauri-plugin-${npmName.slice('@tauri-apps/plugin-'.length)}`;
            }
            return null;
          }

          // The Tauri CLI only requires matching major.minor releases.
          const sameMinor = (a, b) => {
            const [aMaj, aMin] = a.split('.');
            const [bMaj, bMin] = b.split('.');
            return aMaj === bMaj && aMin === bMin;
          };

          const pkg = readJson('package.json');
          const deps = { ...pkg.dependencies, ...pkg.devDependencies };

          const mismatches = [];
          for (const name of Object.keys(deps)) {
            const crate = crateOf(name);
            if (!crate) continue;
            const crateVersion = crateVersions[crate];
            const npmVer = npmVersion(name);
            if (!crateVersion || !npmVer) continue;
            if (!sameMinor(crateVersion, npmVer)) {
              mismatches.push({ name, crate, crateVersion, npmVer });
            }
          }

          if (mismatches.length === 0) {
            console.log('Tauri NPM packages and Rust crates are already in sync.');
          }

          let unresolved = false;

          for (const m of mismatches) {
            console.log(`Mismatch: ${m.crate} (v${m.crateVersion}) : ${m.name} (v${m.npmVer})`);

            if (DRY_RUN) {
              console.log(`[dry-run] would run: pnpm add --save-exact ${m.name}@${m.crateVersion}`);
              unresolved = true;
              continue;
            }

            const [major, minor] = m.crateVersion.split('.');
            let aligned = false;
            for (const spec of [m.crateVersion, `${major}.${minor}`]) {
              const res = spawnSync(`pnpm add --save-exact "${m.name}@${spec}"`, {
                stdio: 'inherit',
                shell: true,
              });
              const now = npmVersion(m.name);
              if (res.status === 0 && now && sameMinor(m.crateVersion, now)) {
                console.log(`Aligned ${m.name} -> ${now} (matches ${m.crate} v${m.crateVersion})`);
                aligned = true;
                break;
              }
            }

            if (!aligned) {
              unresolved = true;
              console.log(
                `::warning=title=Tauri version sync failed::Could not align ${m.name} with ${m.crate} v${m.crateVersion}`
              );
            }
          }

          setBuildArgs(unresolved ? '--ignore-version-mismatches' : '');
          SYNC_EOF

      # ==========================================================
      # Sync version from Git Tag to package.json and tauri.conf.json
      # ==========================================================
      - name: Update version from tag
        shell: bash
        run: |
          set -e
          # 提取纯版本号 (去掉前缀 'v')
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Updating files to version: ${VERSION}"

          # 使用 Node.js 修改 package.json
          node -e "
            const fs = require('fs');
            const pkgPath = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          "

          # 使用 Node.js 修改 src-tauri/tauri.conf.json
          node -e "
            const fs = require('fs');
            const confPath = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = '${VERSION}';
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');
          "

          echo "Version successfully updated in package.json and src-tauri/tauri.conf.json"

      # ==========================================================
      # Setup Rust
      # ==========================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ==========================================================
      # Rust cache
      # ==========================================================
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      # ==========================================================
      # Determine channel and find previous tag
      # ==========================================================
      - name: Determine channel and previous tag
        id: channel
        shell: bash
        run: |
          set -e

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          echo "Current tag: ${TAG}"
          echo "Current version: ${VERSION}"

          if echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-.+'; then
            CHANNEL="preview"
          else
            CHANNEL="stable"
          fi

          echo "Channel: ${CHANNEL}"
          echo "channel=${CHANNEL}" >> "${GITHUB_OUTPUT}"

          PREVIOUS_TAG=""

          if [ "${CHANNEL}" = "stable" ]; then
            PREVIOUS_TAG=$(
              git tag --sort=-version:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | grep -v "^${TAG}$" \
                | head -n 1 \
                || true
            )
          else
            PREVIOUS_TAG=$(
              git tag --sort=-version:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-.+$' \
                | grep -v "^${TAG}$" \
                | head -n 1 \
                || true
            )
          fi

          echo "Previous tag: ${PREVIOUS_TAG:-<none>}"
          echo "previous_tag=${PREVIOUS_TAG}" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # Generate changelog
      # ==========================================================
      - name: Generate changelog
        shell: bash
        run: |
          set -e

          TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG="${{ steps.channel.outputs.previous_tag }}"

          echo "Current tag: ${TAG}"
          echo "Previous tag: ${PREVIOUS_TAG:-<none>}"

          if [ -n "${PREVIOUS_TAG}" ]; then
            RANGE="${PREVIOUS_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          echo "Commit range: ${RANGE}"

          {
            echo "# ${TAG}"
            echo

            echo "## ✨ Features"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- feat(\(.+\))?:' || true
            echo

            echo "## 🐛 Bug Fixes"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- fix(\(.+\))?:' || true
            echo

            echo "## 📚 Documentation"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- docs(\(.+\))?:' || true
            echo

            echo "## ♻️ Refactoring"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- refactor(\(.+\))?:' || true
            echo

            echo "## ⚡ Performance"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- perf(\(.+\))?:' || true
            echo

            echo "## 🧪 Tests"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- test(\(.+\))?:' || true
            echo

            echo "## 🔧 Chores"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- chore(\(.+\))?:' || true
            echo

            echo "## 📝 Other Changes"
            echo
            git log "${RANGE}" --pretty=format:'- %s (%h)' | grep -E '^- (feat|fix|docs|refactor|perf|test|chore)(\(.+\))?:' -v || true
            echo

          } > CHANGELOG.md

          echo ""
          echo "========================================"
          echo "CHANGELOG"
          echo "========================================"
          cat CHANGELOG.md

      # ==========================================================
      # Determine prerelease
      # ==========================================================
      - name: Determine release type
        id: release-type
        shell: bash
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"

          if [ "${CHANNEL}" = "preview" ]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
            echo "Release type: PREVIEW"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
            echo "Release type: STABLE"
          fi

      # ==========================================================
      # Build Tauri + create GitHub Release
      # ==========================================================
      - name: Build and publish Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Release ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          uploadUpdaterJson: false
          args: ${{ steps.tauri_sync.outputs.args || '--target x86_64-pc-windows-msvc' }} --bundles nsis

      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: platform-bundles-*
          path: platform-bundles
          merge-multiple: false

      - name: Create signed multi-platform updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node <<'MANIFEST_EOF'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');

          const tag = process.env.GITHUB_REF_NAME;
          const version = tag.replace(/^v/, '');
          const repository = process.env.GITHUB_REPOSITORY;
          const assetsDir = 'release-assets';
          fs.mkdirSync(assetsDir, { recursive: true });

          function listFiles(directory) {
            if (!fs.existsSync(directory)) return [];
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const entryPath = path.join(directory, entry.name);
              return entry.isDirectory() ? listFiles(entryPath) : [entryPath];
            });
          }

          function copyPlatformAssets(target, sourceDir) {
            const allowed = /\.(?:exe|msi|dmg|deb|rpm|appimage|nsis\.zip|msi\.zip|appimage\.tar\.gz|app\.tar\.gz)(?:\.sig)?$/i;
            const files = listFiles(sourceDir).filter((file) => allowed.test(path.basename(file)));
            if (files.length === 0) throw new Error(`No distributable bundles found for ${target}`);
            for (const file of files) {
              const name = `${target}-${path.basename(file)}`;
              fs.copyFileSync(file, path.join(assetsDir, name));
            }
          }

          function findUpdaterBundle(target, sourceDir, suffix) {
            const bundle = listFiles(sourceDir).find((file) =>
              path.basename(file).toLowerCase().endsWith(suffix.toLowerCase()),
            );
            if (!bundle) throw new Error(`No ${suffix} updater bundle found for ${target}`);
            const signaturePath = `${bundle}.sig`;
            if (!fs.existsSync(signaturePath)) {
              throw new Error(`Updater signature is missing: ${signaturePath}`);
            }
            const filename = path.basename(bundle);
            const assetName = target === 'windows-x86_64'
              ? filename
              : `${target}-${filename}`;
            return {
              assetName,
              signature: fs.readFileSync(signaturePath, 'utf8').trim(),
            };
          }

          const platformBuilds = [
            {
              key: 'linux-x86_64',
              target: 'x86_64-unknown-linux-gnu',
              source: 'platform-bundles/platform-bundles-x86_64-unknown-linux-gnu',
              suffix: '.AppImage',
            },
            {
              key: 'darwin-x86_64',
              target: 'x86_64-apple-darwin',
              source: 'platform-bundles/platform-bundles-x86_64-apple-darwin',
              suffix: '.app.tar.gz',
            },
            {
              key: 'darwin-aarch64',
              target: 'aarch64-apple-darwin',
              source: 'platform-bundles/platform-bundles-aarch64-apple-darwin',
              suffix: '.app.tar.gz',
            },
          ];
          const platforms = {};

          for (const build of platformBuilds) {
            copyPlatformAssets(build.target, build.source);
            const updater = findUpdaterBundle(build.target, build.source, build.suffix);
            platforms[build.key] = {
              url: `https://github.com/${repository}/releases/download/${tag}/${encodeURIComponent(updater.assetName)}`,
              signature: updater.signature,
            };
          }

          const windowsBundleDir = 'target/x86_64-pc-windows-msvc/release/bundle';
          const windowsUpdater = findUpdaterBundle('windows-x86_64', windowsBundleDir, '.exe');
          platforms['windows-x86_64'] = {
            url: `https://github.com/${repository}/releases/download/${tag}/${encodeURIComponent(windowsUpdater.assetName)}`,
            signature: windowsUpdater.signature,
          };

          const manifest = {
            version,
            pub_date: new Date().toISOString(),
            notes: fs.readFileSync('CHANGELOG.md', 'utf8'),
            platforms,
          };
          fs.writeFileSync(path.join(assetsDir, 'latest.json'), `${JSON.stringify(manifest, null, 2)}\n`);

          const upload = spawnSync(
            'gh',
            ['release', 'upload', tag, ...fs.readdirSync(assetsDir).map((name) => path.join(assetsDir, name)), '--clobber'],
            { stdio: 'inherit' },
          );
          if (upload.status !== 0) {
            throw new Error(`Failed to upload platform bundles and updater manifest (gh exit ${upload.status})`);
          }
          MANIFEST_EOF

      # ==========================================================
      # Upload CHANGELOG.md as release asset
      # ==========================================================
      - name: Upload CHANGELOG.md
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            CHANGELOG.md \
            --clobber

      # ==========================================================
      # Replace Release notes with our changelog
      # ==========================================================
      - name: Update release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md

      # ==========================================================
      # Publish Release
      # ==========================================================
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ steps.release-type.outputs.prerelease }}" == "true" ]]; then
            gh release edit "${GITHUB_REF_NAME}" \
              --draft=false \
              --prerelease=true
          else
            gh release edit "${GITHUB_REF_NAME}" \
              --draft=false \
              --prerelease=false
          fi

      # ==========================================================
      # Show final release information
      # ==========================================================
      - name: Release summary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "========================================"
          echo "Release completed"
          echo "========================================"
          echo "Tag: ${GITHUB_REF_NAME}"
          echo "Channel: ${{ steps.channel.outputs.channel }}"
          echo ""

          gh release view "${GITHUB_REF_NAME}"
