<!doctype html>
<html lang="zh-CN" class="h-full" data-window="tray-panel">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EndProtocol</title>
    <script>
      // 与 index.html 一致：渲染前先用系统外观定下 dark 类，避免托盘浮层闪白
      (function () {
        try {
          var root = document.documentElement;
          if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            root.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="m-0 p-0 w-full h-full overflow-hidden">
    <div id="tray-panel-root" class="w-full h-full"></div>
    <script type="module" src="/src/tray-panel.tsx"></script>
  </body>
</html>
